# Render Blueprint for the BattleScope API (backend/). Frontend is deployed separately (frontend/ → Vercel).
services:
  - type: web
    name: battlescope-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: "*"   # tighten to your Vercel URL, e.g. https://battlescope.vercel.app
